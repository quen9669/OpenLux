[project]
name = "openlux"
version = "0.1.0"
description = "Plateforme open data et open source unifiée sur le Luxembourg"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "duckdb>=1.1.0,<1.2.0",
    "dbt-duckdb>=1.8.0",
    "beautifulsoup4>=4.12.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "fastmcp>=0.4.0",
]

[project.scripts]
openlux = "openlux.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["openlux"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
