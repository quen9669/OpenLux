# OpenLux Hub - Registre Unique des Sources (config/sources.toml)
# Règle d'or : 1 entrée [[sources]] = 1 flux HTTP atomique (primaire + backup optionnel).
# Toutes les URLs ci-dessous ont été vérifiées en direct le 2026-11-24 (cf. reports/).
# data_origin : official (producteur public) | model (estimation modélisée) | community | press.
# Jetons d'URL résolus à la collecte : {today} {year} {last_year} {next_year} {now_ms}.

# ───────────────────────────── MÉTÉO & ENVIRONNEMENT ─────────────────────────────

[[sources]]
id = "meteo_findel_meteolux"
domain = "weather"
description = "Observation officielle MeteoLux à la station Luxembourg-Findel (ELLX)"
semantic_summary = "Température, humidité, pression QFF, vent et précipitations mesurés à l'aéroport."
known_limitations = "Une seule station (Findel) ; instantané sans archive : l'historique est construit par accumulation."
parser = "meteolux_hvd"
cadence_minutes = 10
sla_minutes = 60
license_spdx = "CC0-1.0"
data_origin = "official"
[sources.primary]
url = "https://metapi.ana.lu/api/v1/hvd/observations"
[sources.backup]
url = "https://data.public.lu/fr/datasets/r/0e03052d-0506-481d-8fd8-98d670103204"
[sources.quality]
min_rows = 1

[[sources]]
