name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Lint and format check (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run offline tests (pytest)
        run: uv run pytest

      - name: Validate dbt configuration and models
        # POURQUOI : dbt-duckdb résout seeds/ et ../data/ depuis le cwd => exécution dans dbt_project/
        working-directory: dbt_project
        run: |
          uv run dbt parse --project-dir . --profiles-dir .
          uv run dbt test --project-dir . --profiles-dir .

      - name: Validate Open Data publication & metadata dry-run
        run: uv run openlux publish --dry-run
