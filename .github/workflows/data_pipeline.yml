name: OpenLux Data Pipeline & Sync

on:
  schedule:
    # Exécution planifiée automatique toutes les 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      due_only:
        description: 'Exécuter uniquement les flux échus (--due)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: "data-sync"
  cancel-in-progress: false

jobs:
  data-pipeline:
    name: Run Pipeline & Sync Data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Execute OpenLux pipeline (collect, dbt transformations, gold export)
        env:
          JCDECAUX_API_KEY: ${{ secrets.JCDECAUX_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.due_only }}" = "true" ]; then
            uv run openlux run --due
          else
            uv run openlux run
          fi

      - name: Update Open Data catalog metadata (datapackage & DCAT-AP-LU)
        run: uv run openlux publish --dry-run

      - name: Upload DuckDB database artifact
        uses: actions/upload-artifact@v4
        with:
          name: openlux-duckdb
          path: data/openlux.duckdb
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit and push changes if data updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Ajouter les artefacts de la couche Gold, métadonnées et statut
          git add data/gold/*.parquet data/gold/*.json STATUS.md web_v2/data/catalog.json

          # Commit atomique uniquement si des changements réels de données (Parquet Gold) sont détectés
          if git diff --staged --quiet data/gold/*.parquet; then
            echo "Aucune modification de données détectée dans la couche Gold. Rien à commiter."
            git checkout -- STATUS.md data/gold/*.json web_v2/data/catalog.json 2>/dev/null || true
          else
            echo "Modifications de données détectées. Création du commit atomique..."
            git commit -m "chore(data): auto-update gold datasets and status [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
