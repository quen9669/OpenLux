name: Deploy dbt Docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Create empty Bronze placeholders
        run: uv run python -c "from openlux.cli import ensure_bronze_placeholders as e; from openlux.config import load_sources_config as l; e(l())"

      - name: Generate dbt Documentation
        # POURQUOI : dbt-duckdb résout seeds/ et ../data/ depuis le cwd => exécution dans dbt_project/
        working-directory: dbt_project
        run: |
          uv run dbt build --project-dir . --profiles-dir .
          uv run dbt docs generate --project-dir . --profiles-dir .

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dbt_project/target/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
